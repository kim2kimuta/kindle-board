name: build board

on:
  schedule:
    - cron: "0 20 * * *"   # 05:00 JST (Actions may start late, Kindle fetches at 06:05)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # keepalive commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: fonts (Klee One, SIL OFL)
        run: |
          mkdir -p fonts
          for f in KleeOne-Regular KleeOne-SemiBold; do
            curl -fsSL --retry 3 -o fonts/$f.ttf "https://github.com/google/fonts/raw/main/ofl/kleeone/$f.ttf"
          done
      - run: pip install pillow
      - run: python make_board.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # Scheduled workflows stop after 60 days without repo activity; commit once a month.
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Tokyo date +%d)" = "01" ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive [skip ci]" && git push
          fi
